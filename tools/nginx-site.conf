# Конфигурация nginx для сайта на VDS (Ubuntu 22.04/24.04).
# Положить в /etc/nginx/sites-available/aidir и включить: ln -s /etc/nginx/sites-available/aidir /etc/nginx/sites-enabled/
# Заменить example.ru на ваш домен. Версию PHP (php8.3-fpm.sock) подставить свою: ls /run/php/

# ---------- 1. Порт 80: проверка сертификата и переход на https ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    location /.well-known/acme-challenge/ { root /var/www/aidir; }
    location / { return 301 https://example.ru$request_uri; }
}

# ---------- 2. www -> без www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    return 301 https://example.ru$request_uri;
}

# ---------- 3. Основной сайт ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.ru;

    root /var/www/aidir;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;
    client_max_body_size 64k;            # заявки маленькие, большие запросы не нужны

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Сжатие ---
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    # --- Заголовки безопасности (add_header внутри location сбрасывает эти, поэтому там они повторены) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # CSP сначала в режиме наблюдения (Report-Only). Когда в консоли браузера нет нарушений, заменить на Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://widgets.hh.ru 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.hhcdn.ru; font-src 'self' https://*.hhcdn.ru; connect-src 'self' https://widgets.hh.ru https://api.hh.ru; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # --- Статика: долгий кэш (файлы картинок, шрифтов, видео меняются редко) ---
    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    # CSS и JS без хэшей в именах: месяц с перепроверкой. После добавления хэшей в имена можно поставить год и immutable.
    location ~* \.(css|js|webmanifest)$ {
        expires 1M;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location ~* \.pdf$ {
        expires 1M;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # HTML всегда проверяется заново
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- PHP только для обработчика заявок, остальные .php закрыты ---
    location = /api/lead.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # подставьте свою версию
        fastcgi_read_timeout 20s;
    }
    location ~ \.php$ { return 404; }

    # --- Закрыть служебное ---
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(py|md|log|sql|bak|jsonl)$ { deny all; }

    location / { try_files $uri $uri/ =404; }
}
