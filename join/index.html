<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg"><link rel="icon" href="../favicon.ico" sizes="any"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Участие в розыгрыше - AI-DIR</title>
<link rel="stylesheet" href="../join.css">
</head>
<body>
<header class="top">
  <div class="brand">ИИ-Директор · Розыгрыш призов</div>
  <div class="prize"><input id="prize" value="Промокод на скидку 99%" readonly aria-label="Приз"></div>
</header>

<main class="layout">
  <section class="list-wrap">
    <div id="list" class="list" aria-label="Места участников"></div>
  </section>

  <aside class="panel">
    <div id="big" class="big-number" aria-hidden="true" hidden></div>
    <div id="closed" class="jn-msg jn-warn" hidden>Набор участников сейчас закрыт.</div>
    <div id="form-box" class="box xl">
      <h2>Новый участник</h2>
      <form id="jf" autocomplete="off" novalidate>
        <input id="name" name="name" placeholder="Имя" maxlength="30" aria-label="Имя" required>
        <input id="nick" name="nick" placeholder="@ник Telegram" maxlength="33" aria-label="Ник в Telegram" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <div class="jn-hp" aria-hidden="true"><label>Сайт <input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="jn-c"><input id="consent" type="checkbox" name="consent" required>
          <span>Я даю <a href="../legal/consent.html" target="_blank" rel="noopener">согласие на обработку персональных данных</a> (имя и ник Telegram) для участия в розыгрыше призов на условиях <a href="../legal/promo-rules.html" target="_blank" rel="noopener">правил розыгрыша</a>; с <a href="../legal/privacy.html" target="_blank" rel="noopener">политикой конфиденциальности</a> ознакомлен(а).</span></label>
        <div id="err" class="error" role="alert"></div>
        <button id="go" type="submit" class="primary">Добавить</button>
      </form>
    </div>
    <div id="done" class="jn-msg jn-ok" hidden></div>
    <div class="counter">Участников: <b id="cnt">0</b> / 60</div>
  </aside>
</main>
<div id="winner" class="winner" hidden>
  <div class="winner-card">
    <div class="winner-label">Победитель</div>
    <div id="w-num" class="w-num"></div>
    <div id="w-name" class="w-name"></div>
    <div id="w-nick" class="w-nick"></div>
    <div class="winner-prize" id="w-prize"></div>
  </div>
</div>
<script src="../join.js"></script>
</body>
</html>
